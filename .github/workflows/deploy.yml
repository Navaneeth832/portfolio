name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install dependencies
      - name: Install Dependencies
        run: npm ci

      # Generate resume.tex from JSON
      - name: Generate Resume Source
        run: node scripts/build-resume.js

      # Compile LaTeX -> PDF
      - name: Compile Resume PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      # Copy generated PDF into public/
      - name: Copy Resume to Public Folder
        run: |
          mkdir -p public
          cp resume.pdf public/resume.pdf

      # Upload PDF as artifact
      - name: Upload Resume Artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: public/resume.pdf

      # Upload to Google Drive
      - name: Upload Resume to Google Drive
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_DRIVE_FILE_ID: ${{ secrets.GOOGLE_DRIVE_FILE_ID }}
        run: node scripts/upload-drive.js

      # Build Portfolio
      - name: Build Portfolio
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      # Deploy GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist